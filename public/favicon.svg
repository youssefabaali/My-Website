<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a4ff4f"/>
      <stop offset="100%" stop-color="#8cff2e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#8cff2e" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#brandGrad)" stroke-width="10" stroke-opacity="0.35"/>

  <!-- Logo Monogram YA -->
  <g fill="url(#brandGrad)" filter="url(#glow)">
    <!-- Y -->
    <path d="M 95,130 L 140,130 L 172.5,200 L 205,130 L 250,130 L 195,240 L 195,380 L 150,380 L 150,240 Z" />
    
    <!-- A with cutout -->
    <path fill-rule="evenodd" d="M 255,380 L 298,380 L 312,330 L 364,330 L 378,380 L 420,380 L 360,130 L 320,130 Z M 340,185 L 357,280 L 323,280 Z" />
  </g>
</svg>
